<section class="relative flex min-h-dvh flex-col items-center justify-between px-4 py-4 sm:py-10 animate-fade-in">
  <div class="text-center">
    <img src="assets/music.png" alt="Music"
      class="relative z-10 mx-auto w-30 sm:w-1/2 max-w-40 sm:max-w-none rounded-full border-4
        border-primary shadow-[0_0_50px_rgba(208,188,255,0.5)]
         transition-transform duration-700 ease-out hover:scale-105">
  </div>

  <div class="mt-4 sm:mt-10 z-10 text-center">
    <h1 class="font-display font-bold text-4xl sm:text-5xl bg-clip-text text-transparent bg-gradient-to-r from-secondary to-on-surface-variant">
      BeatGuess
    </h1>
    
    <p class="text-on-surface-variant font-bold text-base sm:text-2xl mt-2 sm:mt-3 mb-3 sm:mb-5 px-1">
      Guess the song in 10 seconds. Become a music legend.
    </p>
    
    @if (!genreService.isGenreSelected()) {
      <div class="mt-3 sm:mt-5 animate-fade-up">
        <small class="inline-block bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary font-bold text-xl sm:text-3xl animate-bass-pulse">Select a genre to start the game.</small>
      </div>
    }


    @if (genreService.isGenreSelected()) {
      <button (click)="startPlaying()" class="btn btn-primary animate-fade-up mt-5 sm:mt-10 px-6 sm:px-10 py-3 sm:py-4 text-base sm:text-xl min-h-12 sm:min-h-14 text-on-primary transition-transform duration-400 hover:scale-105 cursor-pointer">
        <span class="material-icons text-3xl leading-none">play_circle</span>
        Start Playing
      </button>
    }
  </div>

  
  <div class="mt-4 sm:mt-15 z-10 text-center w-full max-w-7xl mx-auto">
    <app-genre-cards [genresList]="genresFromArtists" />
  </div>

  <app-music-bars [barsAmount]="10" />
</section>
