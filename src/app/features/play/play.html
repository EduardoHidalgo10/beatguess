<section class="flex flex-col items-center justify-center py-10 animate-fade-in">

    <div class="flex items-center gap-2 mb-6 px-4 py-2 rounded-full glass-card border border-secondary/30">
        <span class="material-symbols-outlined text-secondary">local_fire_department</span>
        <span class="font-bold text-white text-lg">{{ streak() }}</span>
        <span class="text-on-surface-variant text-sm">Streak</span>
    </div>

    <div
        class="glass-card neon-glow-purple relative overflow-hidden w-full h-full sm:max-w-2xl md:max-w-4xl rounded-xl p-10 flex flex-col items-center justify-center text-center border-outline-variant border-2 shadow-[0_0_20px_rgba(208,188,255,0.5)]">
        <div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
            <img class="w-full h-full object-cover" alt="sound wave pattern." src="assets/sound-wave.png" />
        </div>

        @if (artistResource.isLoading()) {
        <div
            class="h-14 w-72 max-w-[90vw] mx-auto rounded-xl bg-white/10 animate-pulse"
            aria-busy="true"
            aria-label="Cargando artista"></div>
        } @else {
        <div class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 max-w-full">
            <h2
                class="text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary text-center">
                {{ artistsService.randomArtist() }}</h2>
            <button
                type="button"
                (click)="changeArtist()"
                class="inline-flex shrink-0 items-center justify-center rounded-md border border-white/20 bg-white/5 px-0.5 py-0.5 text-on-surface-variant transition-colors hover:bg-white/10 hover:text-white cursor-pointer"
                aria-label="Cambia de artista">
                <span class="material-symbols-outlined text-base leading-none" aria-hidden="true">autorenew</span>
            </button>
        </div>
        }

        <h2
            class="relative z-10 mt-5 font-display text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
            Guess the Song</h2>

        <div class="mb-lg relative z-10 mt-10">
            <span class="font-display text-[64px] text-white font-extrabold tracking-tighter drop-shadow-lg">0:08</span>
        </div>

        <div class="relative z-10 mt-5 w-48 h-16 mx-auto">
            <app-music-bars [barsAmount]="6" />
        </div>

        @if (!isMusicPlaying) {
        <button
            (click)="clickPlayButton()"
            class="mt-5 w-18 h-18 rounded-full bg-gradient-to-br from-secondary to-primary-container flex items-center justify-center neon-glow-blue transition-transform duration-150 hover:scale-105 cursor-pointer shadow-[0_0_10px_rgba(208,188,255,0.5)]">
            <span style="font-size: 35px;" class="material-symbols-outlined text-white">play_arrow</span>
        </button>
        } @else {
        <button
            (click)="clickPauseButton()"
            class="mt-5 w-18 h-18 rounded-full bg-gradient-to-br from-secondary to-primary-container flex items-center justify-center neon-glow-blue transition-transform duration-150 hover:scale-105 cursor-pointer shadow-[0_0_10px_rgba(208,188,255,0.5)]">
            <span style="font-size: 35px;" class="material-symbols-outlined text-white">pause</span>
        </button>
        }


        <div class="w-full max-w-xs mt-7">
            <div class="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-secondary neon-glow-blue shadow-[0_0_10px_rgba(76,215,246,0.8)] transition-all duration-300" [style.width.%]="audioProgress()"></div>
            </div>
        </div>
    </div>

@if (isMusicPlaying) {
    <div class="mt-7 w-full max-w-4xl mx-auto px-4">
            <app-songs-cards
                [songs]="artistResource.value()?.data ?? []"
                [currentSong]="currentSong()"
                (nextSong)="onCorrectAnswer()"
                (resetStreak)="onWrongAnswer()" />
        </div>
    }
</section>
