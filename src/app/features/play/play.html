<section class="flex flex-col items-center justify-center py-10">
    <div
        class="glass-card neon-glow-purple relative overflow-hidden w-full h-full sm:max-w-2xl md:max-w-4xl rounded-xl p-10 flex flex-col items-center justify-center text-center border-outline-variant border-2 shadow-[0_0_20px_rgba(208,188,255,0.5)]">
        <div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
            <img class="w-full h-full object-cover" alt="sound wave pattern." src="assets/sound-wave.png" />
        </div>
        <h2
            class="relative z-10 mt-5 font-display text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
            Guess the Song</h2>

        <div class="mb-lg relative z-10 mt-10">
            <span class="font-display text-[64px] text-white font-extrabold tracking-tighter drop-shadow-lg">0:08</span>
        </div>

        <div class="relative z-10 mt-5 w-48 h-16 mx-auto">
            <app-music-bars />
        </div>

        <button
            class="mt-5 w-18 h-18 rounded-full bg-gradient-to-br from-secondary to-primary-container flex items-center justify-center neon-glow-blue transition-transform duration-150 hover:scale-105 cursor-pointer shadow-[0_0_10px_rgba(208,188,255,0.5)]">
            <span style="font-size: 35px;" class="material-symbols-outlined text-white">play_arrow</span>
        </button>


        <div class="w-full max-w-xs mt-7">
            <div class="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
                <div class="h-full w-1/3 bg-secondary neon-glow-blue shadow-[0_0_10px_rgba(76,215,246,0.8)]"></div>
            </div>
        </div>
    </div>


    <div class="mt-7 w-full max-w-4xl mx-auto px-4">
        <app-songs-cards />
    </div>
</section>
