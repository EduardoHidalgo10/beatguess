<div class="relative z-10 mt-4 sm:mt-xl grid w-full max-w-7xl grid-cols-2 gap-3 sm:gap-5 lg:grid-cols-3">

    @for (genre of genresList(); track genre; let i = $index) {
    <div (click)="getGenreName(i)"
        class="group flex min-h-24 sm:min-h-36 cursor-pointer flex-col items-center justify-center gap-sm rounded-[10px] border px-3 sm:px-5 py-4 sm:py-6 text-center shadow-md transition-all duration-150 active:scale-95"
        [ngClass]="genreService.selectedGenre() === genre
          ? 'border-primary bg-primary shadow-lg'
          : 'border-secondary/30 bg-surface-high hover:border-secondary hover:bg-secondary/10 hover:shadow-lg'
        ">
        <span
          class="font-label-sm text-label-sm text-lg sm:text-2xl font-bold text-center"
          [ngClass]="genreService.selectedGenre() === genre ? 'text-on-primary' : 'text-on-surface-variant'"
        >
          {{ genre }}
        </span>
    </div>
    }
</div>
