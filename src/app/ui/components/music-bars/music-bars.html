<div
  class="absolute inset-0 z-0 pointer-events-none opacity-20 flex h-full items-end justify-center gap-2 px-5"
>
  @for (bar of bars(); track $index) {
    <div
      class="bar w-4 shrink-0 rounded-t-full"
      [class]="bar.bgClass + ' ' + bar.heightClass"
      [style.animation-delay.ms]="bar.animationDelayMs"
    ></div>
  }
</div>
